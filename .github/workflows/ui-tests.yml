name: UI Tests

# Базовые permissions всего workflow — без токена.
# Только pages-job declares собственные permissions (обязательное условие GitHub Pages).
permissions: {}

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      browser_size:
        description: "Размер браузера (selenide.browserSize)"
        type: choice
        options:
          - "1920x1200"
          - "1366x768"
        default: "1920x1200"
      test_filter:
        description: "Gradle --tests фильтр (пусто = все тесты). Для проверки «0 тестов» введите, например: no.such.*"
        type: string
        default: ""

# Все переменные определены в самом начале файла
env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  BROWSER_SIZE: ${{ github.event.inputs.browser_size || '1920x1200' }}
  TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
  HEADLESS: "true"
  ALLURE_RESULTS_DIR: "build/allure-results"
  ALLURE_REPORT_DIR: "allure-report"
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  test:
    name: Run UI tests (headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Проверка browser_size: только разрешённые значения, иначе падение job
      - name: Verify browser_size
        shell: bash
        run: |
          case "${BROWSER_SIZE}" in
            1366x768|1920x1200) echo "browser_size=${BROWSER_SIZE}" ;;
            *) echo "::error::Недопустимый browser_size: ${BROWSER_SIZE} (допустимо: 1366x768, 1920x1200)"; exit 1 ;;
          esac

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      # В CI передаются ТОЛЬКО selenide.headless и selenide.browserSize;
      # baseUrl и browser — дефолты TestBase
      - name: Run UI tests
        shell: bash
        run: |
          # test_filter (из workflow_dispatch) → Gradle --tests. Пусто = все тесты.
          FILTER_ARGS=()
          if [ -n "${TEST_FILTER}" ]; then
            FILTER_ARGS+=(--tests "${TEST_FILTER}")
            echo "::notice::Применяю фильтр тестов: --tests \"${TEST_FILTER}\""
          else
            echo "test_filter не задан — запускаю все тесты"
          fi
          ./gradlew test --console=plain \
            -Dselenide.headless="${HEADLESS}" \
            -Dselenide.browserSize="${BROWSER_SIZE}" \
            "${FILTER_ARGS[@]}"

      # if: always() — это условие шага, а не continue-on-error:
      # статус job при падении тестов остаётся failed, но диагностика сохраняется
      - name: Generate Allure report
        if: always()
        run: npx allure generate "${ALLURE_RESULTS_DIR}" -o "${ALLURE_REPORT_DIR}"

      - name: "Upload artifact: allure-results"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: "${{ env.ALLURE_RESULTS_DIR }}"
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

      - name: "Upload artifact: test-reports"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

      - name: "Upload artifact: allure-report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: "${{ env.ALLURE_REPORT_DIR }}"
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    # Публикация даже при упавших тестах (test-job при этом остаётся failed),
    # только для целевых веток (контекст env недоступен в job-if — ветки встроены)
    if: always() && (github.ref_name == 'master' || github.ref_name == 'lispublika')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Download artifact: allure-report"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: allure-report

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
