plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
        "com.codeborne:selenide:7.19.0",
        "org.junit.jupiter:junit-jupiter-api:6.1.3",
        "org.seleniumhq.selenium:selenium-java:4.52.0",
        "io.qameta.allure:allure-junit-platform:3.1.1",
        "io.qameta.allure:allure-selenide:3.1.1"
    )
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    doFirst {
        delete "build/allure-results"
    }
    // Allure results: build/allure-results (local and CI)
    systemProperty "allure.results.directory", "build/allure-results"
    // Forward only if set
    def prop
    prop = System.getProperty("selenide.baseUrl")
    if (prop != null) systemProperty("selenide.baseUrl", prop)
    prop = System.getProperty("selenide.browser")
    if (prop != null) systemProperty("selenide.browser", prop)
    prop = System.getProperty("selenide.browserSize")
    if (prop != null) systemProperty("selenide.browserSize", prop)
    prop = System.getProperty("selenide.headless")
    if (prop != null) systemProperty("selenide.headless", prop)
}

// «0 тестов» — не успех.
// Считаем ТОЛЬКО реально выполненные тесты = testSuite.tests − testSuite.skipped.
// Пропущенные (@Disabled / assumeTrue(false) / @Tag-эксклюзии) НЕ засчитываются:
// иначе run со 0 выполненными тестами ошибочно прошёл бы как успех.
// Если ни одного не выполнено — сборка падает (finalizedBy запускается и при упавшей test).
tasks.register('failOnEmptyTestRun') {
    doLast {
        def files = fileTree("build/test-results/test") { include '*.xml' }.files
        def executed = files.sum(0) { File f ->
            def txt = f.text
            int tests = 0
            int skipped = 0
            def tMatch = (txt =~ /<testsuite\b[^>]*\stests="(\d+)"/)
            if (tMatch.find()) tests = tMatch.group(1).toInteger()
            def sMatch = (txt =~ /<testsuite\b[^>]*\sskipped="(\d+)"/)
            if (sMatch.find()) skipped = sMatch.group(1).toInteger()
            Math.max(0, tests - skipped)
        }
        if (executed == 0) {
            throw new GradleException("No tests were executed (0 non-skipped) — this is NOT a success.")
        }
        logger.lifecycle("failOnEmptyTestRun: OK — executed (non-skipped) = ${executed}")
    }
    mustRunAfter test
}

test.finalizedBy failOnEmptyTestRun
