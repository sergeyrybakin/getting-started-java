plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
        "com.codeborne:selenide:7.19.0",
        "org.junit.jupiter:junit-jupiter-api:6.1.3",
        "org.seleniumhq.selenium:selenium-java:4.52.0",
        "io.qameta.allure:allure-selenide:2.34.0",
        "io.qameta.allure:allure-junit5:2.34.0",
        "org.aspectj:aspectjweaver:1.9.20"
    )
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // -javaagent: aspectjweaver для weaving @Step (резолвим jar из testRuntimeClasspath без хардкода пути кэша)
    jvmArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
        @Override
        List<String> asArguments() {
            def weaverJar = configurations.testRuntimeClasspath.files
                    .find { it.name.startsWith("aspectjweaver") && it.name.endsWith(".jar") }
            if (weaverJar != null) {
                ["-javaagent:${weaverJar}"]
            } else {
                []
            }
        }
    })
    // Forward only if set
    def prop
    prop = System.getProperty("selenide.baseUrl")
    if (prop != null) systemProperty("selenide.baseUrl", prop)
    prop = System.getProperty("selenide.browser")
    if (prop != null) systemProperty("selenide.browser", prop)
    prop = System.getProperty("selenide.browserSize")
    if (prop != null) systemProperty("selenide.browserSize", prop)
    prop = System.getProperty("selenide.headless")
    if (prop != null) systemProperty("selenide.headless", prop)
}